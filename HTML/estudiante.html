<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SPP · Mi Práctica</title>
	<link rel="stylesheet" href="../CSS/variables.css">
	<link rel="stylesheet" href="../CSS/estudiante.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
	<main class="student-shell">
		<aside class="student-sidebar">
			<div>
				<header class="student-brand">
					<div><h1>SPP</h1><p>Software de Prácticas<br>Pedagógicas</p><span aria-hidden="true"></span></div>
					<button class="sidebar-toggle" id="sidebarToggle" aria-label="Alternar menú">
						<i class="fa-solid fa-bars hamburger-icon"></i>
						<i class="fa-solid fa-graduation-cap overlay-cap"></i>
					</button>
				</header>
				<nav class="student-navigation" aria-label="Navegación principal">
					  <a class="student-nav-link student-nav-link--active" href="#practica" aria-current="page"><i class="fa-solid fa-book-open" aria-hidden="true"></i><span>Mi Práctica</span></a>
					<a class="student-nav-link" href="#perfil"><i class="fa-solid fa-user" aria-hidden="true"></i><span>Perfil</span></a>
				</nav>
			</div>
			<a class="student-logout" href="../index.html"><i class="fa-solid fa-door-open" aria-hidden="true"></i><span>Cerrar Sesión</span></a>
		</aside>

		<section class="student-content" id="practica">
			<header class="student-topbar">
				<button class="sidebar-toggle mobile-menu-toggle" id="mobileMenuToggle" aria-label="Abrir menú">
					<i class="fa-solid fa-bars hamburger-icon"></i>
					<i class="fa-solid fa-graduation-cap overlay-cap"></i>
				</button>
				<button class="topbar-icon" type="button" aria-label="Notificaciones"><i class="fa-regular fa-bell" aria-hidden="true"></i></button>
				<button class="topbar-option" type="button" id="themeToggle" aria-label="Cambiar tema"><i class="fa-regular fa-sun" aria-hidden="true"></i><span>Claro</span><i class="fa-solid fa-angle-down" aria-hidden="true"></i></button>
				<button class="student-account" type="button" aria-label="Abrir menú de estudiante"><i class="fa-solid fa-circle-user" aria-hidden="true"></i><span><strong>Nombre Estudiante</strong><small>Estudiante</small></span><i class="fa-solid fa-angle-down" aria-hidden="true"></i></button>
			</header>

			<div class="practice-content-wrapper">
				<section class="practice-panel" aria-labelledby="practice-title">
				<div class="practice-header">
					<h2 id="practice-title">Información de Práctica</h2>
					<div class="practice-status">
						<span>Estado</span>
						<div class="status-badge"></div>
					</div>
				</div>
				<form class="practice-form" action="#" method="post">
					<div class="practice-field"><label for="nombre-practica">Nombre Practica</label><input id="nombre-practica" name="nombre-practica" type="text" placeholder="....."></div>
					<div class="practice-field"><label for="tutor">Tutor Asignado</label><input id="tutor" name="tutor" type="text" placeholder="....."></div>
					<div class="practice-field"><label for="horas">Horas de la Practica</label><input id="horas" name="horas" type="number" placeholder="....."></div>
					<div class="practice-field"><label for="institucion">Institución</label><input id="institucion" name="institucion" type="text" placeholder="....."></div>
					<div class="practice-field"><label for="asesor">Asesor</label><input id="asesor" name="asesor" type="text" placeholder="....."></div>
					<div class="practice-field"><label for="semestre">Semestre</label><input id="semestre" name="semestre" type="text" placeholder="....."></div>
					  <div class="practice-field practice-field--date"><label for="fecha-inicio">Fecha Inicio</label><div><input id="fecha-inicio" name="fecha-inicio" type="text" placeholder="....."><i class="fa-regular fa-calendar" aria-hidden="true"></i></div></div>
					  <div class="practice-field practice-field--date"><label for="fecha-final">Fecha Final</label><div><input id="fecha-final" name="fecha-final" type="text" placeholder="....."><i class="fa-regular fa-calendar" aria-hidden="true"></i></div></div>
					<div class="practice-field"><label for="codigo">Código de la practica</label><input id="codigo" name="codigo" type="text" placeholder="....."></div>
				</form>
				</section>
				<button class="practice-submit" type="button"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i><span>Entrar</span></button>
			</div>
		</section>
	</main>
	<script src="../JavaScript/script.js"></script>
</body>
</html>
